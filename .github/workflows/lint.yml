name: lint

# Pull-request only, deliberately no push trigger: code lands on main only
# through a PR (branch protection enforces this), so a push trigger would
# only ever produce a second, identical run for the same commit a PR run
# already covers. See #4.
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json is valid JSON
        run: jq empty .claude-plugin/plugin.json .codex-plugin/plugin.json

      - name: Validate skills and agents have YAML frontmatter (LF only)
        run: |
          python3 - <<'EOF'
          import glob, re, sys
          paths = sorted(glob.glob("skills/*/SKILL.md") + glob.glob("agents/*.md"))
          if not paths:
              print("::error::no skills/*/SKILL.md or agents/*.md found"); sys.exit(1)
          for path in paths:
              raw = open(path, "rb").read()
              if b"\r\n" in raw:
                  print(f"::error::{path} has CRLF line endings (Claude Code silently ignores it)"); sys.exit(1)
              text = raw.decode("utf-8")
              m = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
              if not m:
                  print(f"::error::{path} missing YAML frontmatter"); sys.exit(1)
              fm = m.group(1)
              if "name:" not in fm or "description:" not in fm:
                  print(f"::error::{path} frontmatter missing 'name' or 'description'"); sys.exit(1)
              print(f"{path}: OK")
          EOF

      - name: Run tests
        run: |
          pip install pytest
          python3 -m pytest tests/ -v

  # The release scripts (.github/scripts/*.sh) must work identically on both
  # OS runners lint.yml's other job doesn't cover: Windows is where a bare
  # `bash` on PATH can resolve to the WSL stub instead of Git Bash
  # (agent-comfy CI round 1), and tests/test_release_scripts.py resolves
  # Git Bash by its well-known absolute path specifically to catch that. A
  # separate job (not a matrix on `validate` above) because that job's own
  # CRLF/frontmatter check is a bash-only `python3 - <<'EOF'` step that
  # would fail outright under windows-latest's pwsh default shell.
  release-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run release scripts tests
        run: |
          pip install pytest
          python -m pytest tests/test_release_scripts.py -v
